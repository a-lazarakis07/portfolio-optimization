  sources:
    - https://ir.nasdaq.com/node/81631
  events:
    - date: '2014-04-03'
      type: share_class_distribution
      description: Google Class C distribution; do not equate backmapped history with current-class investability.
      source_url: https://ir.nasdaq.com/node/81631
VLO:
