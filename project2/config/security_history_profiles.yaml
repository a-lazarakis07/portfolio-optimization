  sources:
    - https://investors.att.com/stockholder-services/cost-basis-guide/worksheet/att-corp
    - https://investors.att.com/stock-information/historical-stock-information/historical-quote/att-inc
  events:
    - date: '2022-04-08'
      type: spin_off
      description: WarnerMedia distribution; source prices and adjusted-return treatment require review.
      source_url: https://investors.att.com/stock-information/historical-stock-information/historical-quote/att-inc
VZ:
  identity_valid_from: '2000-07-03'
  warning: Pre-July-2000 provider history represents Bell Atlantic/predecessor lineage, not an unchanged Verizon economic entity. VZ began NYSE trading after the Bell Atlantic/GTE combination.
  sources:
    - https://www.verizon.com/about/sites/default/files/Verizon_Corporate_History.pdf
  events:
    - date: '2000-06-30'
      type: merger
      description: Bell Atlantic/GTE merger forms Verizon; predecessor exposure is not constant business exposure.
      source_url: https://www.verizon.com/about/our-company/history-and-timeline
HON:
  identity_valid_from: '1999-12-01'
  warning: Earlier provider lineage predates the AlliedSignal/Honeywell combination. Solstice and Aerospace distributions change business exposure; current HON is the automation parent, not GE or HONA. Yahoo corporate-action factors must not be interpreted as verified share-conversion ratios.
  sources:
    - https://www.honeywell.com/us/en/company/history
    - https://www.nasdaqtrader.com/TraderNews.aspx?id=ECA2026-399
  events:
    - date: '2025-10-30'
      type: spin_off
      description: Solstice separation; inspect provider distribution-adjustment treatment.
      source_url: https://www.solstice.com/us/en/about-us/solstice-advanced-materials-history-and-brand-transition
    - date: '2026-06-29'
      type: spin_off_and_reverse_split
      expected_stock_split: 0.5
      description: Aerospace spin-off plus official one-for-two reverse split; a combined provider factor is not the legal share conversion ratio.
      source_url: https://www.nasdaqtrader.com/TraderNews.aspx?id=ECA2026-399
CMCSA:
  identity_valid_from: '2002-11-18'
  warning: Pre-November-2002 provider series maps legacy Comcast into the combined AT&T Broadband/Comcast issuer. Versant separation changes the current economic mix; no separate spun-off history is manually appended.
  sources:
    - https://corporate.comcast.com/news-information/news-feed/comcast-completes-att-broadband-transaction
    - https://cmcsa.gcs-web.com/news-releases/news-release-details/comcast-announces-completion-separation-versant-media-group-inc
  events:
    - date: '2002-11-18'
      type: merger
      description: AT&T Broadband and Comcast combined into a new parent issuer.
      source_url: https://corporate.comcast.com/news-information/news-feed/comcast-completes-att-broadband-transaction
    - date: '2026-01-05'
      type: spin_off
      description: First regular-way session following the January 2 Versant distribution.
      source_url: https://cmcsa.gcs-web.com/news-releases/news-release-details/comcast-announces-completion-separation-versant-media-group-inc
GOOG:
  identity_valid_from: '2014-04-03'
