universe_version: v2-long-history-60
coverage_denominator: all_requested_exchange_sessions
minimum_crisis_coverage: 0.95
corporate_action_review_days: 3
adjustment_ratio_jump_threshold: 0.10
crises:
  dot_com:
    label: Dot-com decline
    start: '2000-03-10'
    end: '2002-10-09'
  gfc:
    label: Global Financial Crisis
    start: '2007-10-09'
    end: '2009-03-09'
  covid:
    label: COVID crash
    start: '2020-02-19'
    end: '2020-03-23'
  inflation_2022:
    label: 2022 inflation and rates shock
    start: '2022-01-03'
    end: '2022-10-12'
outputs:
  coverage_csv: outputs/universe_history_coverage.csv
  daily_flags: data/processed/universe_history_flags.parquet
  corporate_actions_csv: outputs/universe_corporate_action_review.csv
  metadata_json: data/metadata/universe_history_audit.json
  report_md: docs/universe_v2_history_audit.md
